# This configure file set the candidate USB2 phy parameters for both device and host mode separately
# Each parameters list can contain multiple pair of value and register, and both device and host mode
# support multiple parameters list.
# register 0x51 set to 0xd to adjust HS trasmit amplitude
# register 0x53 set to 0x6 to adjust HS disconnect threshold
# register 0x54 set to 0x3 to adjust Squelch detection threshold
[DeviceParameters]
0xd,0x51,0x6,0x53,0x3,0x54
[HostParameters]
0xb,0x51,0x4,0x53,0x2,0x54
